<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptKit Server - Enterprise Prompt Registry</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --card-bg: #1e293b;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            text-align: center;
            padding: 2.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.125rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .cta-btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 600;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }
        .cta-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PromptKit Server</h1>
        <p>Framework-Agnostic Prompt Registry &amp; Management Server. Securely author, version, publish, and deploy prompt assets across your enterprise applications.</p>
        <a href="/dashboard/login/" class="cta-btn">Access Staff Dashboard</a>
    </div>
</body>
</html>
