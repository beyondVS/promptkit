[project]
name = "promptkit-django"
version = "0.1.0"
description = "Django settings and lifecycle integration for the PromptKit SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5,<6",
    "promptkit>=0.1,<0.2",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptkit_django"]
