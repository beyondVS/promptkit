[project]
name = "promptkit"
version = "0.1.0"
description = "Framework-agnostic SDK for read-only PromptKit prompt retrieval"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptkit"]
